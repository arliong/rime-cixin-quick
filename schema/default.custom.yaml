# encoding: utf-8
# 慈心速成 安裝輔助：把方案「追加」到可選列表
#
# ⚠️ 本檔採用「追加」寫法（"schema_list/+"），不會動到使用者既有的
#    方案清單與其它自訂項；但仍建議先備份自己的 default.custom.yaml。
#
# 說明：
#   - "schema_list/+" 的 "/+" 是 librime 的「追加」操作符，
#     會把 cixin_quick 加到既有 schema_list 尾端，而非整段覆蓋。
#   - 拼音反查 / 筆畫反查所需的 luna_pinyin、stroke 詞典，
#     已由 cixin_quick.schema.yaml 的 schema/dependencies 自動編譯，
#     不需要（也不建議）把它們塞進使用者的方案清單。
patch:
  "schema_list/+":
    - schema: cixin_quick
